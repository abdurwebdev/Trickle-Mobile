<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Trickle</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#25465a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e4eef2;
    --ink: #17333f;
    --ink-soft: #587a88;
    --line: #bbd2da;
    --btn: #17333f;
    --btn-ink: #eef7fa;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1a20; --ink: #e5f2f7; --ink-soft: #86abb9; --line: #234050; --btn: #e5f2f7; --btn-ink: #0e1a20;
    }
  }
  :root[data-theme="dark"] { --bg: #0e1a20; --ink: #e5f2f7; --ink-soft: #86abb9; --btn: #e5f2f7; --btn-ink: #0e1a20; }
  
  html, body {
    height: 100%;
    width: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }
  *, *::before, *::after { box-sizing: inherit; }
  
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Poppins", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: clamp(8px, 2vh, 16px) clamp(8px, 2vw, 16px);
    padding-top: max(clamp(8px, 2vh, 16px), env(safe-area-inset-top));
    padding-bottom: max(clamp(8px, 2vh, 16px), env(safe-area-inset-bottom));
    padding-left: max(clamp(8px, 2vw, 16px), env(safe-area-inset-left));
    padding-right: max(clamp(8px, 2vw, 16px), env(safe-area-inset-right));
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
  }
  
  .wrap { 
    width: 100%;
    max-width: min(92vw, calc(100vh - 220px), 500px); 
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
  h1 { margin: 0; font-weight: 700; font-size: clamp(24px, 6vw, 36px); letter-spacing: -0.03em; line-height: 1; }
  .stats { display: flex; gap: clamp(8px, 2.5vw, 14px); }
  .stats div { text-align: right; }
  .stats span { display: block; font-size: clamp(9px, 2.5vw, 11px); color: var(--ink-soft); font-weight: 600; }
  .stats b { font-size: clamp(16px, 4vw, 20px); font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  
  .stage { position: relative; width: 100%; aspect-ratio: 1; border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 3px var(--line, #bbd2da); background: #25465a; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
  
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 18px; text-align: center; background: rgba(14, 40, 54, 0.88); color: #f0f9fc; z-index: 10; }
  .overlay[hidden] { display: none; }
  .overlay h2 { margin: 0; font-size: clamp(22px, 6vw, 34px); font-weight: 700; letter-spacing: -0.02em; }
  .overlay p { margin: 0; max-width: 30ch; line-height: 1.4; font-size: clamp(12px, 3.5vw, 14px); color: #cfe5ec; font-weight: 500; }
  .stars { font-size: clamp(28px, 8vw, 38px); letter-spacing: 6px; color: #ffd166; line-height: 1; }
  .stars .off { color: rgba(255, 255, 255, 0.28); }
  
  .controls { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; max-width: 500px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: 100%; }
  
  button.go { font: inherit; font-weight: 600; font-size: clamp(13px, 3.5vw, 15px); background: var(--btn); color: var(--btn-ink); border: 0; border-radius: 999px; padding: 8px 18px; cursor: pointer; }
  button.ghost { font: inherit; font-weight: 600; font-size: clamp(12px, 3.2vw, 14px); background: transparent; color: var(--ink); border: 2px solid var(--line, #bbd2da); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .overlay button.go { background: #ffd166; color: #2a1d00; }
  button:active { transform: scale(0.97); }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  
  .hint { margin: 0; text-align: center; font-size: clamp(11px, 2.8vw, 12px); color: var(--ink-soft); font-weight: 500; max-width: 42ch; line-height: 1.3; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Trickle</h1>
      <div class="stats">
        <div><span>Level</span><b id="lvl">1</b></div>
        <div><span>Taps</span><b id="moves">0</b></div>
        <div><span>Par</span><b id="par">0</b></div>
        <div><span>Best</span><b id="best">1</b></div>
      </div>
    </header>
    <div class="stage" id="stage">
      <canvas id="c" aria-label="Pipe puzzle board"></canvas>
      <div class="overlay" id="overlay" hidden>
        <h2 id="ovTitle"></h2>
        <div class="stars" id="stars"></div>
        <p id="ovText"></p>
        <div class="row" style="margin-top: 6px;"><button class="go" id="nextBtn">Next level</button><button class="go" id="againBtn" style="background:transparent;color:#f0f9fc;box-shadow:0 0 0 2px rgba(255,255,255,0.5) inset">Replay</button></div>
      </div>
    </div>
  </div>
  
  <div class="controls">
    <div class="row">
      <button class="ghost" id="hintBtn">Hint</button>
      <button class="ghost" id="resetBtn">Reset</button>
      <button class="ghost" id="freshBtn">New layout</button>
    </div>
    <p class="hint">Tap a tile to turn it. Connect every pipe to the tap to water the garden.</p>
  </div>

<script>
(function () {
  var DR = [-1, 0, 1, 0], DC = [0, 1, 0, -1];
  var canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  var overlay = document.getElementById('overlay');
  var lvlEl = document.getElementById('lvl'), movesEl = document.getElementById('moves'), parEl = document.getElementById('par'), bestEl = document.getElementById('best');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var TAU = Math.PI * 2;

  var level = 1, n, masks, sol, start, src, lit, moves, par, solved, hintTile, cursor, petals, anims, bestLevel = 1, winT = 0;
  try { bestLevel = parseInt(localStorage.getItem('trickle-best') || '1', 10) || 1; } catch (e) {}
  bestEl.textContent = bestLevel;

  function rot(m) { return ((m << 1) | (m >> 3)) & 15; }
  function rotN(m, k) { for (var i = 0; i < k; i++) m = rot(m); return m; }
  function popcount(m) { return (m & 1) + ((m >> 1) & 1) + ((m >> 2) & 1) + ((m >> 3) & 1); }
  function sizeFor(l) { return Math.min(8, 3 + Math.floor((l - 1) / 2)); }

  function generate(size) {
    var total = size * size, m = new Array(total).fill(0), deg = new Array(total).fill(0), inTree = new Array(total).fill(false);
    var s = (size >> 1) * size + (size >> 1), limit = 3, count = 1;
    inTree[s] = true;
    while (count < total) {
      var cand = [];
      for (var u = 0; u < total; u++) {
        if (!inTree[u] || deg[u] >= limit) continue;
        var r = Math.floor(u / size), c = u % size;
        for (var d = 0; d < 4; d++) {
          var rr = r + DR[d], cc = c + DC[d];
          if (rr < 0 || rr >= size || cc < 0 || cc >= size) continue;
          var v = rr * size + cc; if (!inTree[v]) cand.push([u, d, v]);
        }
      }
      if (!cand.length) { limit = 4; continue; }
      var e = cand[Math.floor(Math.random() * cand.length)];
      m[e[0]] |= 1 << e[1]; m[e[2]] |= 1 << ((e[1] + 2) % 4); deg[e[0]]++; deg[e[2]]++; inTree[e[2]] = true; count++;
    }
    return { solution: m, source: s };
  }

  function computeLit(mk) {
    var seen = new Array(n * n).fill(false), q = [src]; seen[src] = true;
    for (var i = 0; i < q.length; i++) {
      var u = q[i], r = Math.floor(u / n), c = u % n;
      for (var d = 0; d < 4; d++) {
        if (!(mk[u] & (1 << d))) continue;
        var rr = r + DR[d], cc = c + DC[d]; if (rr < 0 || rr >= n || cc < 0 || cc >= n) continue;
        var v = rr * n + cc;
        if (!seen[v] && (mk[v] & (1 << ((d + 2) % 4)))) { seen[v] = true; q.push(v); }
      }
    }
    return seen;
  }
  function litCount() { var k = 0; lit.forEach(function (x) { if (x) k++; }); return k; }
  function needed(cur, target) { for (var k = 0; k < 4; k++) if (rotN(cur, k) === target) return k; return 0; }

  function newPuzzle(l) {
    level = l; n = sizeFor(l);
    var g = generate(n); sol = g.solution; src = g.source;
    do {
      masks = sol.map(function (m) { return rotN(m, Math.floor(Math.random() * 4)); });
      lit = computeLit(masks);
    } while (litCount() === n * n);
    start = masks.slice();
    par = masks.reduce(function (a, m, i) { return a + needed(m, sol[i]); }, 0);
    begin();
  }
  function begin() {
    masks = start.slice(); lit = computeLit(masks); moves = 0; solved = false; hintTile = -1; anims = {}; petals = []; winT = 0; cursor = src;
    overlay.hidden = true; updateHud();
  }
  function updateHud() { lvlEl.textContent = level; movesEl.textContent = moves; parEl.textContent = par; bestEl.textContent = bestLevel; }

  function turn(i, dir) {
    if (solved) return;
    var k = dir || 1;
    masks[i] = rotN(masks[i], k === 1 ? 1 : 3);
    anims[i] = { t: 0, from: k === 1 ? -Math.PI / 2 : Math.PI / 2 };
    moves++; hintTile = -1; lit = computeLit(masks); updateHud();
    if (litCount() === n * n) win();
  }

  function win() {
    solved = true; winT = 0;
    for (var i = 0; i < (reduceMotion ? 10 : 60); i++) petals.push({ x: Math.random(), y: -Math.random() * 0.6, vy: 0.25 + Math.random() * 0.4, sw: Math.random() * 6, r: Math.random() * 6, c: ['#ff7aa8', '#ffb3cf', '#ffd166', '#9ff0c4'][i % 4] });
    var stars = moves <= par + 2 ? 3 : moves <= Math.round(par * 1.5) + 4 ? 2 : 1;
    if (level >= bestLevel) { bestLevel = level + 1; try { localStorage.setItem('trickle-best', String(bestLevel)); } catch (e) {} }
    setTimeout(function () {
      if (!solved) return;
      document.getElementById('ovTitle').textContent = 'Garden Watered!';
      document.getElementById('stars').innerHTML = [0, 1, 2].map(function (k) { return k < stars ? '<span>★</span>' : '<span class="off">★</span>'; }).join('');
      document.getElementById('ovText').textContent = moves + ' taps (par ' + par + '). Next up: ' + sizeFor(level + 1) + ' × ' + sizeFor(level + 1) + '.';
      overlay.hidden = false; document.getElementById('nextBtn').focus(); updateHud();
    }, reduceMotion ? 200 : 1100);
  }

  function hint() {
    if (solved) return;
    var wrong = []; for (var i = 0; i < masks.length; i++) if (masks[i] !== sol[i]) wrong.push(i);
    if (!wrong.length) return;
    hintTile = wrong[Math.floor(Math.random() * wrong.length)]; hintAt = performance.now();
  }
  var hintAt = 0;

  var size = 0, gap = 5, tile = 0;
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    var r = canvas.getBoundingClientRect();
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    size = r.width;
  }
  window.addEventListener('resize', resize);

  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function ease(p) { return 1 - Math.pow(1 - p, 3); }

  function flower(cx, cy, r, isLit, tm, idx) {
    var pulse = isLit && !reduceMotion ? 1 + 0.06 * Math.sin(tm / 260 + idx) : 1;
    if (!isLit) {
      ctx.fillStyle = '#a9a48c';
      for (var i = 0; i < 5; i++) { var a = i / 5 * TAU + 0.4; ctx.beginPath(); ctx.ellipse(cx + Math.cos(a) * r * 0.55, cy + Math.sin(a) * r * 0.55 + r * 0.12, r * 0.38, r * 0.2, a, 0, TAU); ctx.fill(); }
      ctx.fillStyle = '#7d7862'; ctx.beginPath(); ctx.arc(cx, cy + r * 0.1, r * 0.3, 0, TAU); ctx.fill();
    } else {
      for (var j = 0; j < 7; j++) { var b = j / 7 * TAU + tm / 4000; ctx.fillStyle = j % 2 ? '#ff7aa8' : '#ff9cc0'; ctx.beginPath(); ctx.arc(cx + Math.cos(b) * r * 0.6 * pulse, cy + Math.sin(b) * r * 0.6 * pulse, r * 0.38 * pulse, 0, TAU); ctx.fill(); }
      ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(cx, cy, r * 0.36 * pulse, 0, TAU); ctx.fill();
    }
  }

  function draw(tm, dt) {
    if (!canvas.width) return;
    ctx.setTransform(canvas.width / size, 0, 0, canvas.width / size, 0, 0);
    ctx.fillStyle = '#25465a'; ctx.fillRect(0, 0, size, size);
    if (!masks) return;
    var pad = 8; tile = (size - pad * 2 - gap * (n - 1)) / n;
    for (var i = 0; i < n * n; i++) {
      var r = Math.floor(i / n), c = i % n, x = pad + c * (tile + gap), y = pad + r * (tile + gap), cx = x + tile / 2, cy = y + tile / 2;
      var isLit = lit[i], m = masks[i];
      ctx.fillStyle = isLit ? '#e7f3fb' : '#e8eef0'; rr(x, y, tile, tile, tile * 0.16); ctx.fill();
      if (hintTile === i) { var ph = (tm - hintAt) / 1000; if (ph < 3) { ctx.strokeStyle = 'rgba(255,170,40,' + (0.5 + 0.5 * Math.sin(ph * 9)) + ')'; ctx.lineWidth = 4; rr(x + 2, y + 2, tile - 4, tile - 4, tile * 0.14); ctx.stroke(); } else hintTile = -1; }
      
      var an = anims[i], angle = 0;
      if (an) { an.t += dt / 0.14; if (an.t >= 1) delete anims[i]; else angle = an.from * (1 - ease(an.t)); }
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(angle);
      var pw = tile * 0.26, half = tile / 2;
      ctx.lineCap = 'butt';
      for (var pass = 0; pass < 2; pass++) {
        ctx.strokeStyle = pass === 0 ? (isLit ? '#2b7fd0' : '#6f808a') : (isLit ? '#55acff' : '#a3b1b9');
        ctx.fillStyle = ctx.strokeStyle;
        ctx.lineWidth = pass === 0 ? pw + 5 : pw;
        for (var d = 0; d < 4; d++) {
          if (!(m & (1 << d))) continue;
          ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.sin(d * Math.PI / 2) * (half + 1), -Math.cos(d * Math.PI / 2) * (half + 1)); ctx.stroke();
        }
        ctx.beginPath(); ctx.arc(0, 0, (pass === 0 ? pw + 5 : pw) / 2, 0, TAU); ctx.fill();
      }
      if (isLit && !reduceMotion) {
        ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 2.5; ctx.setLineDash([5, 11]); ctx.lineDashOffset = -tm / 22;
        for (var d2 = 0; d2 < 4; d2++) { if (!(m & (1 << d2))) continue; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.sin(d2 * Math.PI / 2) * half, -Math.cos(d2 * Math.PI / 2) * half); ctx.stroke(); }
        ctx.setLineDash([]);
      }
      ctx.restore();
      if (i === src) {
        ctx.fillStyle = '#ffcf4a'; ctx.strokeStyle = '#c9961a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, tile * 0.2, 0, TAU); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#2b7fd0'; ctx.beginPath(); ctx.moveTo(cx, cy - tile * 0.11); ctx.quadraticCurveTo(cx + tile * 0.1, cy + tile * 0.02, cx, cy + tile * 0.1); ctx.quadraticCurveTo(cx - tile * 0.1, cy + tile * 0.02, cx, cy - tile * 0.11); ctx.fill();
      } else if (popcount(m) === 1) flower(cx, cy, tile * 0.24, isLit, tm, i);
    }
    
    if (solved) {
      petals.forEach(function (p) { p.y += p.vy * dt; p.r += dt * 4; ctx.fillStyle = p.c; ctx.save(); ctx.translate(p.x * size + Math.sin(p.y * 8 + p.sw) * 14, p.y * size); ctx.rotate(p.r); ctx.beginPath(); ctx.ellipse(0, 0, 6, 3, 0, 0, TAU); ctx.fill(); ctx.restore(); });
    }
  }

  var last = performance.now();
  function frame(ms) {
    var dt = Math.min(0.05, (ms - last) / 1000); last = ms;
    draw(ms, dt);
    requestAnimationFrame(frame);
  }

  canvas.tabIndex = 0;
  function tileFrom(e) {
    var rc = canvas.getBoundingClientRect(), x = e.clientX - rc.left, y = e.clientY - rc.top, pad = 8;
    var c = Math.floor((x - pad + gap / 2) / (tile + gap)), r = Math.floor((y - pad + gap / 2) / (tile + gap));
    if (c < 0 || c >= n || r < 0 || r >= n) return -1; return r * n + c;
  }
  canvas.addEventListener('pointerdown', function (e) { e.preventDefault(); var i = tileFrom(e); if (i >= 0) { cursor = i; turn(i, e.button === 2 || e.shiftKey ? -1 : 1); } });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  canvas.addEventListener('keydown', function (e) {
    var r = Math.floor(cursor / n), c = cursor % n;
    if (e.key === 'ArrowLeft' && c > 0) cursor--; else if (e.key === 'ArrowRight' && c < n - 1) cursor++;
    else if (e.key === 'ArrowUp' && r > 0) cursor -= n; else if (e.key === 'ArrowDown' && r < n - 1) cursor += n;
    else if (e.key === ' ' || e.key === 'Enter') turn(cursor, e.shiftKey ? -1 : 1); else return;
    e.preventDefault();
  });

  document.getElementById('nextBtn').addEventListener('click', function () { newPuzzle(level + 1); });
  document.getElementById('againBtn').addEventListener('click', begin);
  document.getElementById('hintBtn').addEventListener('click', hint);
  document.getElementById('resetBtn').addEventListener('click', begin);
  document.getElementById('freshBtn').addEventListener('click', function () { newPuzzle(level); });

  resize();
  newPuzzle(1);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
