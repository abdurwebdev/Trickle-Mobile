<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Puffs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #2b1055 0%, #7597de 100%);
    --panel-bg: rgba(255, 255, 255, 0.12);
    --panel-border: rgba(255, 255, 255, 0.25);
    --text-main: #ffffff;
    --text-sub: #ffd166;
    --btn-primary: linear-gradient(to bottom, #ffc837 0%, #ff8008 100%);
    --btn-shadow: #b35200;
  }

  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
  
  body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    background: var(--bg-gradient);
    font-family: 'Fredoka', sans-serif;
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    overflow: hidden;
    padding: env(safe-area-inset-top, 12px) 12px env(safe-area-inset-bottom, 12px) 12px;
  }

  /* Top HUD Bar */
  .hud-container {
    width: 100%;
    max-width: 420px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 2px solid var(--panel-border);
    border-radius: 20px;
    padding: 8px 16px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    z-index: 10;
  }

  .hud-box {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .hud-box span {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #e0e0e0;
    font-weight: 600;
  }

  .hud-box b {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-main);
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
  }

  #lives {
    color: #ff5c8a;
    letter-spacing: 1px;
  }

  /* Main Game Stage Container */
  .stage-wrapper {
    position: relative;
    width: 100%;
    max-width: 420px;
    flex: 1;
    max-height: calc(100dvh - 140px);
    aspect-ratio: 2 / 3;
    background: rgba(0, 0, 0, 0.2);
    border-radius: 28px;
    border: 4px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.1);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 24px;
  }

  /* Candy-style Overlay Menus */
  .overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, rgba(43, 16, 85, 0.85) 0%, rgba(20, 8, 40, 0.95) 100%);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    z-index: 20;
    transition: opacity 0.25s ease;
  }

  .overlay[hidden] {
    display: none;
  }

  .overlay h2 {
    font-size: 42px;
    font-weight: 700;
    margin: 0 0 10px 0;
    background: linear-gradient(to bottom, #ffffff 40%, #ffd166 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
  }

  .overlay p {
    font-size: 15px;
    line-height: 1.4;
    color: #e2d9f3;
    margin: 0 0 24px 0;
    max-width: 28ch;
  }

  /* Candy Crush Style 3D Button */
  button.go {
    font-family: 'Fredoka', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #ffffff;
    background: var(--btn-primary);
    border: none;
    border-radius: 999px;
    padding: 14px 40px;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--btn-shadow), 0 10px 20px rgba(0,0,0,0.4);
    transition: transform 0.1s, box-shadow 0.1s;
  }

  button.go:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 var(--btn-shadow), 0 5px 10px rgba(0,0,0,0.4);
  }

  /* Bottom Controls Footer */
  .footer-bar {
    width: 100%;
    max-width: 420px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 8px;
  }

  .hint {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.7);
    margin: 0;
  }

  .mute-btn {
    font-family: 'Fredoka', sans-serif;
    background: var(--panel-bg);
    border: 2px solid var(--panel-border);
    color: #ffffff;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 16px;
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(4px);
  }
</style>
</head>
<body>

  <!-- Top HUD -->
  <div class="hud-container">
    <div class="hud-box">
      <span>Score</span>
      <b id="score">0</b>
    </div>
    <div class="hud-box">
      <span>Balloons</span>
      <b id="count">0</b>
    </div>
    <div class="hud-box">
      <span>Lives</span>
      <b id="lives">♥♥♥</b>
    </div>
    <div class="hud-box">
      <span>Best</span>
      <b id="best">0</b>
    </div>
  </div>

  <!-- Game Stage -->
  <div class="stage-wrapper" id="stage">
    <canvas id="c" aria-label="Balloon pump game"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">Puff</h2>
      <p id="ovText">Hold screen to pump the balloon. Release when it matches inside the glowing target ring!</p>
      <button class="go" id="goBtn">Play</button>
    </div>
  </div>

  <!-- Footer Actions -->
  <div class="footer-bar">
    <p class="hint">Hold & release in the target ring</p>
    <button class="mute-btn" id="mute" aria-pressed="false">Sound: On</button>
  </div>

<script>
(function () {
  var W = 400, H = 600, CX = 200, CY = 300, TAU = Math.PI * 2;
  var canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  var stage = document.getElementById('stage'), overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle'), ovText = document.getElementById('ovText'), goBtn = document.getElementById('goBtn');
  var scoreEl = document.getElementById('score'), countEl = document.getElementById('count'), livesEl = document.getElementById('lives'), bestEl = document.getElementById('best'), muteBtn = document.getElementById('mute');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var COLORS = ['#ef476f', '#ffd166', '#06d6a0', '#4cc9f0', '#b28dff', '#ff9f68'];

  var best = 0;
  try { best = parseInt(localStorage.getItem('puff-best') || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  /* ---------- audio ---------- */
  var actx = null, muted = false, hum = null;
  function ensureAudio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
    if (actx && actx.state === 'suspended') actx.resume();
  }
  function startHum() {
    if (!actx || muted || hum) return;
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = 'triangle'; o.frequency.value = 180; g.gain.value = 0.0001; g.gain.linearRampToValueAtTime(0.07, actx.currentTime + 0.05);
    o.connect(g); g.connect(actx.destination); o.start(); hum = { o: o, g: g };
  }
  function setHum(r) { if (hum) hum.o.frequency.setTargetAtTime(170 + r * 3.2, actx.currentTime, 0.03); }
  function stopHum() { if (!hum) return; var h = hum; hum = null; h.g.gain.setTargetAtTime(0.0001, actx.currentTime, 0.03); h.o.stop(actx.currentTime + 0.15); }
  function chime(acc) {
    if (!actx || muted) return;
    [0, 4, 7].forEach(function (semi, i) {
      var t = actx.currentTime + i * 0.07, o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = 523 * Math.pow(2, (semi + (acc > 0.75 ? 5 : 0)) / 12);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.15, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 0.35);
    });
  }
  function popSound() {
    if (!actx || muted) return;
    var t = actx.currentTime, n = Math.floor(actx.sampleRate * 0.25), buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
    var s = actx.createBufferSource(), g = actx.createGain(); g.gain.value = 0.5; s.buffer = buf; s.connect(g); g.connect(actx.destination); s.start(t);
  }
  function flopSound() {
    if (!actx || muted) return;
    var t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(420, t); o.frequency.exponentialRampToValueAtTime(90, t + 0.6);
    g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 0.65);
  }

  /* ---------- game state ---------- */
  var state = 'ready';
  var round, target, band, r, lives, score, streak, count, color, anim, floaters, parts, texts, holding, rate, lastTarget, shake, now = 0;

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2.5), rc = canvas.getBoundingClientRect();
    canvas.width = Math.round(rc.width * dpr); canvas.height = Math.round(rc.height * dpr);
  }
  window.addEventListener('resize', resize);

  function livesText() { return new Array(Math.max(0, lives) + 1).join('♥') || '-'; }
  function hud() { scoreEl.textContent = score; countEl.textContent = count; livesEl.textContent = livesText(); }

  function newRound() {
    round++;
    var t;
    do { t = 62 + Math.random() * 78; } while (lastTarget && Math.abs(t - lastTarget) < 24);
    target = t; lastTarget = t;
    band = Math.max(6, 24 - round * 1.1);
    rate = 52 * (1 + Math.min(round, 45) * 0.055);
    color = COLORS[(round - 1) % COLORS.length];
    r = 14; holding = false; state = 'waiting';
  }

  function reset() {
    round = 0; lives = 3; score = 0; streak = 0; count = 0; floaters = floaters || []; parts = []; texts = []; anim = null; lastTarget = 0; shake = 0;
    hud(); newRound();
  }

  function start() { ensureAudio(); overlay.hidden = true; floaters = []; reset(); }

  function press() {
    ensureAudio();
    if (state === 'ready') { start(); return; }
    if (state === 'over') { if (performance.now() - overAt > 450) start(); return; }
    if (state !== 'waiting') return;
    state = 'inflating'; holding = true; startHum();
  }

  function release() {
    if (state !== 'inflating') return;
    holding = false; stopHum();
    var off = r - target, w = band;
    if (r < target - w) { fail('flop'); return; }
    if (r > target + w) { fail('pop'); return; }
    var acc = 1 - Math.abs(off) / w, perfect = acc > 0.75;
    streak = perfect ? streak + 1 : 0;
    var pts = Math.round(100 + acc * 100 + streak * 25);
    score += pts; count++; hud();
    chime(acc);
    texts.push({ x: CX, y: CY - r - 24, t: 0, s: (perfect ? (streak > 1 ? 'Perfect x' + streak : 'Perfect!') : 'Nice!') + ' +' + pts, c: perfect ? '#ffd166' : '#fff' });
    anim = { kind: 'launch', t: 0, r: r, color: color };
    state = 'resolve';
  }

  var overAt = 0;
  function fail(kind) {
    streak = 0; lives--; hud();
    if (kind === 'pop') {
      popSound(); shake = reduceMotion ? 0 : 1;
      for (var i = 0; i < (reduceMotion ? 10 : 36); i++) { var a = Math.random() * TAU, s = 120 + Math.random() * 280; parts.push({ x: CX + Math.cos(a) * r * 0.6, y: CY + Math.sin(a) * r * 0.6, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, t: 0, c: color, rot: Math.random() * 6 }); }
      texts.push({ x: CX, y: CY - 30, t: 0, s: 'POP!', c: '#ff8fa3' });
      anim = { kind: 'pop', t: 0 };
    } else {
      flopSound();
      texts.push({ x: CX, y: CY - r - 24, t: 0, s: 'Too small', c: '#e4d2ec' });
      anim = { kind: 'flop', t: 0, r: r, color: color };
    }
    state = 'resolve';
  }

  function endGame() {
    state = 'over'; overAt = performance.now();
    var nb = score > best;
    if (nb) { best = score; bestEl.textContent = best; try { localStorage.setItem('puff-best', String(best)); } catch (e) {} }
    ovTitle.textContent = 'Game Over';
    ovText.textContent = 'Score: ' + score + ' points. ' + (nb && score > 0 ? 'New Record!' : 'Best: ' + best);
    goBtn.textContent = 'Play Again'; overlay.hidden = false; goBtn.focus();
  }

  /* ---------- update & draw ---------- */
  function update(dt) {
    now += dt;
    if (state === 'inflating') {
      var accel = 1 + (r / 160);
      r += rate * accel * dt; setHum(r);
      if (r > target + band + 0.5) { holding = false; stopHum(); fail('pop'); }
    }
    if (anim) {
      anim.t += dt;
      var dur = anim.kind === 'launch' ? 0.8 : anim.kind === 'pop' ? 0.9 : 0.8;
      if (anim.kind === 'launch' && anim.t > 0.35 && !anim.added) { anim.added = true; floaters.push({ x: CX + (Math.random() - 0.5) * 30, y: CY, r: anim.r * 0.5, vy: -170, color: anim.color, sw: Math.random() * 6, ph: Math.random() * 6 }); if (floaters.length > 28) floaters.shift(); }
      if (anim.t >= dur) { anim = null; if (lives <= 0) endGame(); else newRound(); }
    }
    floaters.forEach(function (f) { if (f.y > 90 + (f.stack || 0)) { f.y += f.vy * dt; f.vy = Math.max(-170, f.vy - 0); } f.ph += dt; });
    floaters.forEach(function (f, i) { if (!f.stack) f.stack = 30 + (i * 53) % 120; if (!f.tx) f.tx = 40 + (i * 97) % 320; f.x += (f.tx - f.x) * Math.min(1, dt * 1.5); });
    parts.forEach(function (p) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.rot += dt * 8; });
    parts = parts.filter(function (p) { return p.t < 1.1; });
    texts.forEach(function (t) { t.t += dt; });
    texts = texts.filter(function (t) { return t.t < 0.9; });
    if (shake > 0) shake = Math.max(0, shake - dt * 3);
  }

  function balloonPath(cx, cy, rad) {
    ctx.beginPath();
    ctx.moveTo(cx, cy + rad * 1.08);
    ctx.bezierCurveTo(cx - rad * 1.05, cy + rad * 0.55, cx - rad * 1.0, cy - rad * 1.0, cx, cy - rad * 1.05);
    ctx.bezierCurveTo(cx + rad * 1.0, cy - rad * 1.0, cx + rad * 1.05, cy + rad * 0.55, cx, cy + rad * 1.08);
    ctx.closePath();
  }
  function drawBalloon(cx, cy, rad, col, alpha, wob) {
    ctx.save(); ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.translate(cx, cy); ctx.rotate(wob || 0); ctx.translate(-cx, -cy);
    balloonPath(cx, cy, rad); ctx.fillStyle = col; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.ellipse(cx - rad * 0.38, cy - rad * 0.42, rad * 0.14, rad * 0.26, -0.5, 0, TAU); ctx.fill();
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(cx, cy + rad * 1.08); ctx.lineTo(cx - 6, cy + rad * 1.08 + 9); ctx.lineTo(cx + 6, cy + rad * 1.08 + 9); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function draw(tm) {
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 10 * shake, (Math.random() - 0.5) * 10 * shake);
    
    // Background gradient inside canvas stage
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#38166c'); g.addColorStop(0.7, '#5d419c'); g.addColorStop(1, '#8f65c6');
    ctx.fillStyle = g; ctx.fillRect(-10, -10, W + 20, H + 20);

    // Clouds
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    [[80, 120, 1], [300, 190, 0.8], [210, 70, 0.6]].forEach(function (c, i) { var dx = reduceMotion ? 0 : Math.sin(tm / 4000 + i) * 10; ctx.beginPath(); ctx.ellipse(c[0] + dx, c[1], 44 * c[2], 14 * c[2], 0, 0, TAU); ctx.ellipse(c[0] + 26 * c[2] + dx, c[1] - 8 * c[2], 28 * c[2], 12 * c[2], 0, 0, TAU); ctx.fill(); });

    floaters.forEach(function (f) {
      var wob = reduceMotion ? 0 : Math.sin(f.ph * 1.4 + f.sw) * 0.08;
      ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(f.x, f.y + f.r * 1.2); ctx.quadraticCurveTo(f.x + Math.sin(f.ph + f.sw) * 8, f.y + f.r * 1.2 + 24, f.x, f.y + f.r * 1.2 + 44); ctx.stroke();
      drawBalloon(f.x, f.y, f.r, f.color, 1, wob);
    });

    // Pump graphic
    ctx.fillStyle = '#42285e'; ctx.fillRect(CX - 10, 520, 20, 56);
    ctx.fillStyle = '#2b1442'; ctx.fillRect(CX - 38, 568, 76, 14);
    var hy = 500 + (state === 'inflating' ? 22 + Math.sin(tm / 90) * 14 : 0);
    ctx.fillStyle = '#ff6b8b'; ctx.fillRect(CX - 36, hy - 10, 72, 12);
    ctx.fillStyle = '#2b1442'; ctx.fillRect(CX - 4, hy, 8, 26);

    // Target rings
    if (state === 'waiting' || state === 'inflating') {
      ctx.fillStyle = 'rgba(255,255,255,0.1)';
      ctx.beginPath(); ctx.arc(CX, CY, target + band, 0, TAU); ctx.arc(CX, CY, Math.max(1, target - band), 0, TAU, true); ctx.fill();
      var pulse = reduceMotion ? 1 : 0.7 + 0.3 * Math.sin(tm / 220);
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.7 + 0.3 * pulse) + ')'; ctx.lineWidth = 3; ctx.setLineDash([8, 8]);
      ctx.beginPath(); ctx.arc(CX, CY, target + band, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(CX, CY, Math.max(1, target - band), 0, TAU); ctx.stroke(); ctx.setLineDash([]);
      ctx.strokeStyle = 'rgba(255,209,102,0.95)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(CX, CY, target, 0, TAU); ctx.stroke();
    }

    if (state === 'waiting' || state === 'inflating') {
      var wob2 = reduceMotion ? 0 : (state === 'inflating' ? Math.sin(tm / 60) * 0.025 * (r / 100) : 0);
      ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(CX, CY + r * 1.08 + 8); ctx.quadraticCurveTo(CX, 500, CX, hy - 10); ctx.stroke();
      drawBalloon(CX, CY, r, color, 1, wob2);
      if (state === 'waiting') { ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.font = '600 20px "Fredoka", sans-serif'; ctx.textAlign = 'center'; ctx.fillText('Hold to pump', CX, 560); }
    }
    if (anim && anim.kind === 'launch') {
      var p = Math.min(1, anim.t / 0.8), e = p * p;
      drawBalloon(CX, CY - e * 360, anim.r * (1 - p * 0.5), anim.color, 1 - Math.max(0, p - 0.7) * 3, Math.sin(anim.t * 8) * 0.1);
    }
    if (anim && anim.kind === 'flop') {
      var q = Math.min(1, anim.t / 0.8), rr = anim.r * (1 - q);
      if (rr > 2) { var fx = CX + Math.sin(anim.t * 22) * 40 * (1 - q), fy = CY + q * 120; drawBalloon(fx, fy, rr, anim.color, 1, Math.sin(anim.t * 30) * 0.5); }
    }

    parts.forEach(function (pp) { ctx.save(); ctx.globalAlpha = Math.max(0, 1 - pp.t / 1.1); ctx.translate(pp.x, pp.y); ctx.rotate(pp.rot); ctx.fillStyle = pp.c; ctx.fillRect(-5, -3, 10, 6); ctx.restore(); });
    texts.forEach(function (t) { ctx.globalAlpha = Math.max(0, 1 - t.t / 0.9); ctx.fillStyle = t.c; ctx.font = '700 24px "Fredoka", sans-serif'; ctx.textAlign = 'center'; ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 5; ctx.fillText(t.s, t.x, t.y - t.t * 30); ctx.shadowBlur = 0; ctx.globalAlpha = 1; });
    ctx.restore();
  }

  var last = performance.now();
  function frame(ms) {
    var dt = Math.min(0.04, (ms - last) / 1000); last = ms;
    update(dt); draw(ms);
    requestAnimationFrame(frame);
  }

  /* ---------- input ---------- */
  stage.addEventListener('pointerdown', function (e) { if (e.target === goBtn) return; e.preventDefault(); press(); });
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  goBtn.addEventListener('click', function () { if (state === 'over' || state === 'ready') start(); });
  muteBtn.addEventListener('click', function () { muted = !muted; if (muted) stopHum(); muteBtn.textContent = muted ? 'Sound: Off' : 'Sound: On'; muteBtn.setAttribute('aria-pressed', String(muted)); });

  floaters = [];
  resize(); reset(); state = 'ready'; target = 100; band = 24; r = 70; color = COLORS[0];
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
